  <path d="M 62 12 L 63.5 16.5 L 68 18 L 63.5 19.5 L 62 24 L 60.5 19.5 L 56 18 L 60.5 16.5 Z" fill="#D4FF00" stroke="#000000" stroke-width="1.6" stroke-linejoin="round" />
  <path d="M 87 37 L 88.5 41 L 93 42.5 L 88.5 44 L 87 48 L 85.5 44 L 81 42.5 L 85.5 41 Z" fill="#D4FF00" stroke="#000000" stroke-width="1.6" stroke-linejoin="round" />
  <path d="M 21 68 L 23.5 74.5 L 30 77 L 23.5 79.5 L 21 86 L 18.5 79.5 L 12 77 L 18.5 74.5 Z" fill="#D4FF00" stroke="#000000" stroke-width="2" stroke-linejoin="round" />
  <path d="M 13 56 L 14.5 60 L 19 61.5 L 14.5 63 L 13 67 L 11.5 63 L 7 61.5 L 11.5 60 Z" fill="#D4FF00" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" />
